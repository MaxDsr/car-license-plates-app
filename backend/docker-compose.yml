services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: license-plates-backend
    ports:
      - "${HOST_PORT}:${PORT}"
    environment:
      - PORT=${PORT}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT}/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

