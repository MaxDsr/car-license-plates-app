name: Test Workflow

on:
  push:
    branches: [ configure-deployment ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: List files
        run: ls -a
        
      - name: Echo hello world
        run: echo "hello world"

      - name: Write API key to file
        run: echo "${{ secrets.OVERHEID_API_KEY }}" > key.txt

      - name: Verify key.txt was created
        run: |
          echo "Checking if key.txt exists:"
          ls -la key.txt
          echo "File contents (first 10 characters):"
          head -c 10 key.txt